<!DOCTYPE html>
<html>
<head>

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>

body{
    background:#f5f7fb;
}

.login-card{
    border:none;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.portal-title{
    color:#4f46e5;
    font-weight:700;
}

.form-control{
    border-radius:10px;
}

.btn-primary{
    border-radius:10px;
}
.btn-primary{
    border:none;
    border-radius:12px;
    padding:12px;
    font-weight:600;
    transition:0.3s;
}

.btn-primary:hover{
    transform:translateY(-2px);
}
</style>

</head>

<body>
<div class="container">

   <div class="row justify-content-center align-items-center"
     style="min-height:100vh;">

        <div class="col-md-5">

           <div class="card login-card">

                <div class="card-body p-4">

                  <div class="text-center mb-4">
<div class="mb-3">
    <i class="bi bi-mortarboard-fill text-primary"
       style="font-size:50px;"></i>
</div>
    <h5 class="portal-title">
        Placement Prediction Portal
    </h5>

    <h2 class="fw-bold">
        Student Login
    </h2>

    <p class="text-muted">
        Sign in to access your dashboard
    </p>

</div>
{% if messages %}
    {% for message in messages %}
        <div class="alert alert-danger">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}
                   <form method="POST">

    {% csrf_token %}

    <div class="mb-3">

        <label class="form-label">
            Username
        </label>

        <input type="text"
               name="username"
               class="form-control"
               required>

    </div>

   <div class="mb-3">

    <label class="form-label">
        Password
    </label>

    <div class="input-group">

        <input type="password"
               id="password"
               name="password"
               class="form-control"
               required>

        <button type="button"
                class="btn btn-outline-secondary"
                onclick="togglePassword()">

            <i class="bi bi-eye"></i>

        </button>

    </div>

</div>

    <button type="submit"
            class="btn btn-primary w-100">

        Login

    </button>

</form>
<div class="text-center mt-4">

    <small>

        Don't have an account?

        <a href="/register/">
            Register Here
        </a>

    </small>

</div>
<div class="mt-3 text-center">
    <a href="/" class="text-decoration-none">
        ← Back to Home
    </a>
</div>
                </div>

            </div>

        </div>

    </div>

</div>
<script>

function togglePassword(){

    const passwordField =
        document.getElementById("password");

    if(passwordField.type === "password"){

        passwordField.type = "text";

    }else{

        passwordField.type = "password";

    }
}

</script>
</body>
</html>
