<!DOCTYPE html>
<html>
<head>

<title>Placement Prediction</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>Placement Prediction Result</h2>

{% if message %}

<p>{{ message }}</p>

{% else %}

<h3>Placement Chance: {{ category }}</h3>

<h4>Placement Probability: {{ score }}%</h4>

<h4>Recommended Roles:</h4>

<ul>

{% for role in roles %}

<li>{{ role }}</li>

{% endfor %}

</ul>

{% endif %}

<a href="/dashboard/" class="btn btn-secondary">
Back to Dashboard
</a>

</div>

</body>
</html>
